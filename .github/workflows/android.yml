name: Android

on:
  push:
    branches: [main, "claude/**"]
    paths: ["android/**", ".github/workflows/android.yml"]
  pull_request:
    paths: ["android/**", ".github/workflows/android.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Test and build APK
        run: ./gradlew :core:test :app:assembleRelease --console=plain
      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk limits-ai.apk
      - uses: actions/upload-artifact@v4
        with:
          name: limits-ai-apk
          path: android/limits-ai.apk
      # Каждая сборка из main публикуется релизом: последняя версия всегда по ссылке
      # https://github.com/<owner>/<repo>/releases/latest/download/limits-ai.apk
      - name: Publish release
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.0.${{ github.run_number }}
          name: Limits AI 1.0.${{ github.run_number }}
          files: android/limits-ai.apk
          make_latest: true
